# ==============================================================================
# Database Secret Setup Guide (Security Best Practice)
# ==============================================================================
# DO NOT COMMIT REAL PASSWORDS TO GIT.
#
# Create this secret in your EKS cluster directly via kubectl:
#
#   kubectl create namespace wild-tour --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic wild-tour-db-secret \
#     --namespace wild-tour \
#     --from-literal=DB_USER='root' \
#     --from-literal=DB_PASSWORD='your-strong-password-here' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "wild-tour.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: "admin"
  DB_PASSWORD: "change-me-in-cluster"
