apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wild-tour-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    app: wild-tour
spec:
  project: default
  source:
    repoURL: https://github.com/2004Pruthvi/gitops-eks-platform.git
    targetRevision: main
    path: helm/wild-tour
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wild-tour
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
